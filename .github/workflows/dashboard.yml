name: Kindle dashboard

on:
  schedule:
    # 予備の定期実行(3時間おき)。普段は Cloudflare Workers から30分ごとに起動される
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest は中身が切り替わることがあるので版を固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 日本語フォント: apt を使わず、GitHub 上の Noto Sans JP を取得してキャッシュする
      # (apt のミラー障害で exit code 100 になって止まるのを避けるため)
      - name: フォントのキャッシュ
        id: fontcache
        uses: actions/cache@v4
        with:
          path: fonts
          key: noto-sans-jp-v1

      - name: フォントを取得(キャッシュがないときだけ)
        if: steps.fontcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          base=https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/JP
          for w in Bold Regular; do
            curl -fsSL --retry 3 --retry-delay 5 -o "fonts/NotoSansJP-$w.otf" "$base/NotoSansJP-$w.otf"
          done
          ls -la fonts

      - name: 依存パッケージ
        run: pip install -r requirements.txt

      - name: 画像を生成
        run: python dashboard.py --font fonts/NotoSansJP-Bold.otf --font-regular fonts/NotoSansJP-Regular.otf

      - name: 公開用フォルダを作る
        run: |
          mkdir -p site
          cp out/dashboard.png out/dashboard_preview.png site/
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
          <title>Kindle dashboard</title>
          <body style="margin:0;background:#888">
          <img src="dashboard_preview.png" style="width:100%;height:auto;display:block">
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
